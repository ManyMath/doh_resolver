name: Dart checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # The transport depends on platform sockets and TLS; report every OS.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: ['3.5.0', stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: ${{ matrix.sdk }}
      # doh_transport is not on pub.dev yet; resolve it from a sibling clone
      # the same way the README describes for development.
      - run: |
          git clone --filter=blob:none --no-checkout https://github.com/cypherstack/doh_transport.git ../doh_transport
          git -C ../doh_transport checkout --detach b00296109b2cb260798e944e2f0a928dc284cf4b
          test "$(git -C ../doh_transport rev-parse HEAD)" = "b00296109b2cb260798e944e2f0a928dc284cf4b"
        shell: bash
      - run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            doh_transport:
              path: ../doh_transport
          YAML
        shell: bash
      - run: dart tool/check.dart
